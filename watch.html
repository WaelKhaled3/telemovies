<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>TeleMovies</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"><link rel="stylesheet" href="/site.css"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b121b"><script src="/app.js" defer></script></head><body><header><a class="logo" href="/">Tele<span>Movies</span></a><nav><a href="/">الرئيسية</a><a href="/#library">المكتبة</a></nav></header><main id="v"><div class="wrap"><p>جارٍ التحميل…</p></div></main><footer><p class="legal"><a href="/dmca">DMCA</a><a href="/privacy">الخصوصية</a><a href="/contact">اتصل بنا</a></p><p>© TeleMovies</p></footer>
<script>
const slugify=t=>String(t||"").normalize("NFKC").replace(/\p{M}/gu,"").trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-+|-+$/g,"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s||"").replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,"").trim();
const link=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const HEX=/^#[0-9a-f]{3,8}$/i;
const IC={play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',down:'<path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/>',msg:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',chan:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/>',req:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 9v6M9 12h6"/>',flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]||IC.link}</svg>`;
(async()=>{const v=document.getElementById("v"),want=decodeURIComponent(location.hash.slice(1));
try{const d=await(await fetch("/films.json?v="+Date.now())).json(),S=d.site||{},used=new Set();let m=null;
(d.movies||[]).forEach((x,i)=>{let s=slugify(x.slug)||slugify(x.title)+(x.year?"-"+slugify(x.year):"")||"work-"+(i+1);if(used.has(s))s+="-"+(i+1);used.add(s);if(s===want)m=x});
if(!m){v.innerHTML='<div class="wrap"><h1>العمل غير موجود</h1><p><a href="/">العودة إلى الرئيسية</a></p></div>';return}
const LB=k=>((S.labels||{})[k]||"").trim()||{watch:"مشاهدة عبر تيليغرام",download:"تحميل العمل",message:"رابط الرسالة",channel:"رابط القناة",share:"مشاركة"}[k];
const CL=k=>HEX.test((S.colors||{})[k]||"")?S.colors[k]:{watch:"#2aa7e3",download:"#1f9d8b",message:"#3b82c4",channel:"#5b7288",share:"#2b3a4c"}[k];
const TXW=k=>((S.texts||{})[k]||"").trim()||{noticeTitle:"تنبيه",noticeDefault:"نعمل حالياً على تحديث رابط هذا العمل، عُد بعد قليل.",reportHint:"الرابط لا يعمل؟ أبلغنا وسنصلحه بأسرع وقت.",reportMsg:"مرحباً، رابط «{title}» لا يعمل: {url}",reportCopied:"تم نسخ رسالة جاهزة، الصقها في المحادثة"}[k],RQ=S.request||{},k=/مسلسل|series/i.test(m.category||"")?"مسلسل":"فيلم";document.title=m.title+" | TeleMovies";
const b=(l,u,c,ic,cls)=>{u=link(u);return u?`<a class="btn-a ${cls||""}" href="${esc(u)}" target="_blank" rel="nofollow noopener noreferrer" style="background:${c}">${ico(ic)}<span>${esc(clean(l))}</span></a>`:""};
const btns=b(LB("watch"),m.watchLink||m.link,CL("watch"),"play")+b(LB("download"),m.downloadLink,CL("download"),"down")+b(LB("message"),m.telegramMessageLink,CL("message"),"msg")+b(LB("channel"),m.telegramChannelLink,CL("channel"),"chan")+(m.customButtons||[]).filter(x=>x&&x.enabled!==false).map(x=>b(x.label,x.url,HEX.test(x.color||"")?x.color:"#2aa7e3","link")).join("");
const share=(S.show||{}).share!==false&&!m.hideShare?`<button type="button" class="btn-a" data-share style="background:${CL("share")}">${ico("share")}<span>${esc(clean(LB("share")))}</span></button>`:"";
const rq=RQ.enabled!==false&&!m.hideRequest?b(RQ.text||"اطلب فيلم",RQ.url||"https://t.me/WaelKhaled3",HEX.test(RQ.color||"")?RQ.color:"#d97706","req","req"):"";
const NT=["warn","info","error"].includes(m.noticeType)?m.noticeType:"warn",notice=m.noticeOn?`<div class="notice n-${NT}"><div class="notice-in"><span class="notice-ic">${ico(NT==="info"?"info":"alert")}</span><div><strong>${esc(TXW("noticeTitle"))}</strong><p>${esc(m.noticeText||TXW("noticeDefault"))}</p></div></div></div>`:"",RP=S.report||{},rep=RP.enabled!==false&&!m.hideReport&&btns&&link(RP.url||RQ.url||"https://t.me/WaelKhaled3")?`<a class="btn-a rep" href="${esc(link(RP.url||RQ.url||"https://t.me/WaelKhaled3"))}" target="_blank" rel="nofollow noopener noreferrer" data-report="${esc(TXW("reportMsg").replace("{title}",m.title).replace("{url}",location.href))}" data-copied="${esc(TXW("reportCopied"))}" style="background:${HEX.test(RP.color||"")?RP.color:"#b91c1c"}">${ico("flag")}<span>${esc(clean(RP.text||"الإبلاغ عن رابط لا يعمل"))}</span></a>`:"";
v.innerHTML=`${notice}<section class="mv">${m.image?`<div class="mv-bg" style="background-image:url('${esc(m.image)}')"></div>`:""}<div class="mv-in">${m.image?`<img class="mv-poster" src="${esc(m.image)}" alt="" width="300" height="450">`:""}<div class="mv-body"><h1 class="mv-title">${esc(m.title)}</h1>${m.titleAr?`<p class="alt">${esc(m.titleAr)}</p>`:""}<div class="chips">${m.year?`<span class="hl">${esc(m.year)}</span>`:""}${m.category?`<span>${esc(m.category)}</span>`:""}<span>${k}</span></div><p class="mv-desc">${esc(m.description||m.title)}</p>${m.viewingNote?`<p class="view-note">${esc(m.viewingNote)}</p>`:""}${m.viewingInstructions?`<div class="steps">${esc(m.viewingInstructions)}</div>`:""}<div class="acts">${btns}${share}</div>${rq||rep?`<div class="help-row">${rep?`<div class="help-card hc-rep"><p>${esc(TXW("reportHint"))}</p>${rep}</div>`:""}${rq?`<div class="help-card hc-req"><p>${esc(RQ.hint||"لم تجد ما تبحث عنه؟ اطلب العمل وسنحاول إضافته.")}</p>${rq}</div>`:""}</div>`:""}</div></div></section>`}catch{v.innerHTML='<div class="wrap"><p>تعذّر تحميل البيانات.</p></div>'}})();
</script></body></html>
