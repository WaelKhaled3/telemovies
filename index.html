<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeleMovies | عالم السينما</title>
<meta name="description" content="اكتشف عالم الأفلام في TeleMovies">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg:#090d0c;
  --panel:#111917;
  --green:#176b49;
  --light:#39b77c;
  --text:#f3f5f3;
  --muted:#929c96;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Cairo',sans-serif;
}
button,input{font-family:inherit}
header{
  height:75px;padding:0 7%;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid #ffffff12;
  background:#090d0cf2;position:sticky;top:0;z-index:5;
  backdrop-filter:blur(15px);
}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--light)}
nav{display:flex;gap:27px}
nav a{color:#c2cbc5;text-decoration:none;font-size:14px}
nav a:hover{color:var(--light)}
.hero{
  min-height:390px;padding:80px 9%;
  display:flex;align-items:center;
  background:linear-gradient(90deg,#090d0c 10%,#090d0cce 65%,#090d0c80),
  url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1600')
  center/cover;
}
.hero-content{max-width:570px}
.tag{color:var(--light);font-size:13px;font-weight:700}
.hero h1{font-size:43px;line-height:1.5;margin:12px 0}
.hero p{color:#b2bdb6;line-height:2;font-size:15px}
.search{
  display:flex;gap:10px;margin-top:25px;max-width:470px
}
.search input{
  flex:1;min-width:0;padding:14px 17px;border-radius:9px;
  background:#18221e;border:1px solid #ffffff18;color:white;
  outline:none;
}
.search input:focus{border-color:var(--light)}
.search button,.main-btn{
  background:var(--green);color:white;border:0;
  border-radius:9px;padding:12px 20px;cursor:pointer;
}
.search button:hover,.main-btn:hover{background:#21865c}
main{padding:45px 7%}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:25px;gap:15px
}
.section-head h2{font-size:23px;margin:0}
.section-head span{color:var(--muted);font-size:12px}
.movies{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:22px;
}
.movie{cursor:pointer;min-width:0}
.poster{
  position:relative;overflow:hidden;border-radius:11px;
  aspect-ratio:2/3;background:#17211c;
}
.poster img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .4s;
}
.movie:hover .poster img{transform:scale(1.07)}
.poster:after{
  content:"";position:absolute;inset:40% 0 0;
  background:linear-gradient(transparent,#000b);
}
.movie-info{padding:10px 2px}
.movie-info h3{font-size:15px;margin:0 0 5px}
.movie-info p{font-size:12px;color:var(--muted);margin:0}
.movie:hover h3{color:var(--light)}
.empty{
  grid-column:1/-1;text-align:center;padding:60px;
  color:var(--muted)
}
footer{
  border-top:1px solid #ffffff12;padding:30px 7%;
  color:var(--muted);font-size:12px;text-align:center;
}
footer strong{color:var(--light)}
.overlay{
  position:fixed;inset:0;background:#000b;
  display:none;align-items:center;justify-content:center;
  padding:18px;z-index:20;backdrop-filter:blur(6px);
}
.overlay.show{display:flex}
.dialog{
  background:#111a16;border:1px solid #ffffff1a;
  border-radius:17px;padding:30px;max-width:420px;
  width:100%;text-align:center;position:relative;
}
.close{
  position:absolute;left:15px;top:12px;
  background:none;border:0;color:#aab4ad;
  font-size:25px;cursor:pointer;
}
.dialog h2{font-size:23px;margin:12px 0}
.dialog p{color:var(--muted);font-size:13px;line-height:2}
.dialog .main-btn{display:block;width:100%;margin-top:18px}
.skip{
  display:block;color:#aeb8b1;text-decoration:none;
  margin-top:14px;font-size:13px
}
.details{
  max-width:650px;text-align:right;
  display:flex;gap:22px;align-items:flex-start
}
.details img{width:145px;aspect-ratio:2/3;object-fit:cover;border-radius:10px}
.details h2{margin:0 0 8px}
.details p{line-height:1.9}
.details .main-btn{margin-top:10px}
@media(max-width:900px){
