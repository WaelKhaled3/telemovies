<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0e1621"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/ui.css"><script src="/app.js" defer></script><!--SEO_HEAD--><!--/SEO_HEAD--><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#0e1621;--panel:#17212b;--panel2:#202b36;--blue:#229ed9;--blue2:#168ac4;--text:#f4f7fa;--muted:#9aa8b5;--line:#ffffff12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif}button,input{font-family:inherit}
header{height:68px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0e1621f2;z-index:5;backdrop-filter:blur(12px)}
.logo{font-size:24px;font-weight:900}.logo span,footer strong{color:var(--blue)}nav{display:flex;gap:22px}nav a{color:#cbd5de;text-decoration:none;font-size:13px}
.hero{padding:62px 9%;background:radial-gradient(ellipse at 80% 40%,#229ed926,transparent 55%),linear-gradient(110deg,#0e1621,#132536)}.hero-in{max-width:650px}.tag{color:#51b9eb;font-size:13px;font-weight:800}.hero h1{font-size:38px;line-height:1.5;margin:10px 0}.hero p{color:#b0bdc9;line-height:2}
.search{display:flex;gap:9px;max-width:480px;margin-top:20px}.search input{flex:1;min-width:0;padding:12px 15px;border-radius:11px;background:var(--panel);border:1px solid #ffffff20;color:white}.search button,.btn{border:0;border-radius:9px;padding:10px 16px;background:var(--blue);color:white;text-decoration:none;display:inline-block;cursor:pointer}
main{padding:34px 7%}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.head h2{font-size:21px;margin:0}.head span{font-size:12px;color:var(--muted)}
.category-bar{display:flex;gap:8px;overflow:auto;padding:2px 0 17px}.chip{white-space:nowrap;border:1px solid #ffffff18;background:var(--panel);color:#cbd5de;border-radius:22px;padding:7px 14px;cursor:pointer}.chip.active{background:var(--blue);color:white}
.movies{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}.movie{cursor:pointer;min-width:0}.poster{aspect-ratio:2/3;border-radius:11px;overflow:hidden;background:var(--panel)}.poster img{width:100%;height:100%;object-fit:cover;transition:.3s}.movie:hover img{transform:scale(1.04)}.movie h3{font-size:14px;margin:9px 0 3px}.movie small{color:var(--muted)}.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}
footer{text-align:center;border-top:1px solid var(--line);padding:25px;color:var(--muted);font-size:12px}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20;backdrop-filter:blur(5px)}.overlay.show{display:flex}.dialog{position:relative;width:100%;max-width:450px;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid #ffffff20;border-radius:16px;padding:25px;box-shadow:0 18px 70px #0009}.close{position:absolute;left:12px;top:8px;border:0;background:none;color:#b9c5cf;font-size:26px;cursor:pointer}.sub{text-align:center}.sub h2{margin:10px 0}.sub p,.detail p{color:#b8c5d0;font-size:13px;line-height:2}.sub .btn{display:block;margin-top:15px}.skip{display:block;color:#b8c5d0;margin-top:13px;text-decoration:none;font-size:13px}
.detail{max-width:700px;display:flex;gap:20px;align-items:flex-start}.detail img{width:145px;aspect-ratio:2/3;object-fit:cover;border-radius:9px}.detail-body{flex:1;min-width:0}.detail h2{margin:0 0 6px}.meta{color:#51b9eb!important}.view-note{background:#123249;border:1px solid #229ed955;border-radius:10px;padding:10px 12px;color:#d9effa!important;margin:12px 0}.instructions{white-space:pre-line}
.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.action-btn{border:0;border-radius:9px;padding:10px 15px;color:white;text-decoration:none;font-size:13px;display:inline-block}.action-btn:hover{filter:brightness(1.12)}
@media(max-width:900px){.movies{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){header{padding:0 5%;height:60px}nav{gap:10px}nav a{font-size:11px}.logo{font-size:20px}.hero{padding:45px 6%}.hero h1{font-size:29px}main{padding:27px 5%}.movies{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.detail{display:block}.detail img{width:105px;margin-bottom:12px}}
[hidden]{display:none!important}.legal a{color:#cbd5de;margin:0 8px;text-decoration:none}a.movie{display:block;color:inherit;text-decoration:none}.cats a{display:inline-block;margin:3px 6px;color:#cbd5de;text-decoration:none;border:1px solid #ffffff18;border-radius:20px;padding:3px 12px}</style></head>
<body>
<header><div class="logo">Tele<span>Movies</span></div><nav><a href="#">الرئيسية</a><a href="#library">المكتبة</a><a href="#about">عن الموقع</a></nav><!--SEO_MENU--><!--/SEO_MENU--></header>
<section class="hero"><!--SEO_HERO--><!--/SEO_HERO--></section>
<main id="library"><div class="head"><h2>مكتبة TeleMovies</h2><span id="count"></span></div><div class="category-bar" id="categoryBar"></div><div class="movies" id="movieList"><!--SEO_LIST--><!--/SEO_LIST--></div></main>
<footer id="about"><strong>TeleMovies</strong><!--SEO_ABOUT--><!--/SEO_ABOUT--><!--SEO_CATS--><!--/SEO_CATS-->© 2026 TeleMovies<p class="legal"><a href="/dmca">DMCA</a> · <a href="/privacy">الخصوصية</a> · <a href="/contact">اتصل بنا</a></p><button id="installBtn" class="btn" hidden type="button">📲 ثبّت التطبيق</button><p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p></footer>
<div class="overlay" id="subscribe"><div class="dialog sub"><button class="close" id="closeSubscribe">×</button><div style="font-size:38px">🎬</div><h2>أهلاً بك في TeleMovies</h2><p>تابع قناتنا على تيليغرام لتصلك أحدث الإضافات.</p><a class="btn" id="channelLink" href="https://t.me/tele_moves" target="_blank" rel="noopener">اشترك بالقناة</a><a class="skip" href="#" id="skipSubscribe">متابعة إلى الموقع</a></div></div>
<script>
const defaults={channelUrl:"https://t.me/tele_moves",categories:["أفلام","أكشن","دراما","مغامرة","كوميدي","رعب","خيال علمي","مسلسلات سورية"]};
let site={},movies=[],categories=[],active="الكل",channelUrl=defaults.channelUrl;const $=id=>document.getElementById(id),s=v=>String(v??"");
function safeLink(v){if(!v)return "";try{const u=new URL(v);return ["https:","http:"].includes(u.protocol)?u.href:"";}catch{return "";}}
const slugify=t=>String(t||"").normalize("NFKC").replace(/\p{M}/gu,"").trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-+|-+$/g,"");
function slugs(){const used=new Set();movies.forEach((m,i)=>{let s=slugify(m.slug)||slugify(m.title)+(m.year?"-"+slugify(m.year):"")||"work-"+(i+1);if(used.has(s))s+="-"+(i+1);used.add(s);m._s=s})}
const norm=x=>String(x??"").normalize("NFKC").toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const setHTML=(el,h)=>{el.replaceChildren(document.createRange().createContextualFragment(h))};
const moviePath=m=>(window.TM_BUILT&&TM_BUILT.includes(m._s))?"/movie/"+encodeURI(m._s)+"/":"/watch#"+encodeURIComponent(m._s);
async function load(){try{const r=await fetch("./films.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();const d=await r.json();movies=Array.isArray(d.movies)?d.movies:[];slugs();site=d.site||{};categories=Array.isArray(d.categories)?d.categories:defaults.categories;channelUrl=safeLink(d.channelUrl)||defaults.channelUrl;}catch{movies=[];categories=defaults.categories;}$("channelLink").href=channelUrl;renderCategories();renderMovies();}
function renderCategories(){const root=$("categoryBar");root.replaceChildren();["الكل",...categories].forEach(c=>{const b=document.createElement("button");b.className="chip"+(active===c?" active":"");b.textContent=c;b.onclick=()=>{active=c;renderCategories();renderMovies()};root.append(b)});}
function renderMovies(){const toks=norm($("search").value).split(/\s+/).filter(Boolean).map(w=>w.length>4?w.replace(/^ال/,""):w);const list=movies.filter(m=>(active==="الكل"||m.category===active)&&(h=>toks.every(w=>h.includes(w)))(norm([m.title,m.titleAr,m.category,m.year,m.description].join(" "))));$("count").textContent=list.length+" أعمال";const root=$("movieList");root.replaceChildren();if(!list.length){const e=document.createElement("div");e.className="empty";e.textContent="لا توجد أعمال ضمن هذا القسم حالياً.";root.append(e);return;}const ev=(site.ads&&site.ads.between)?(+site.ads.every||8):0;list.forEach((m,i)=>{const card=document.createElement("a");card.className="movie";card.href=moviePath(m);const p=document.createElement("div");p.className="poster";const img=document.createElement("img");img.src=(m.image||"").replace("/t/p/w500/","/t/p/w342/");img.alt=m.title||"بوستر";img.loading="lazy";img.width=300;img.height=450;p.append(img);const h=document.createElement("h3");h.textContent=m.title||"بدون عنوان";const sm=document.createElement("small");sm.textContent=[m.year,m.category].filter(Boolean).join(" · ");card.append(p,h,sm);root.append(card);if(ev&&(i+1)%ev===0&&i+1<list.length){const a=document.createElement("div");a.className="ad";setHTML(a,site.ads.between);root.append(a)}});}
function closeSubscribe(){$("subscribe").classList.remove("show");localStorage.setItem("teleMoviesSubscribeSeen","yes")}
$("search").addEventListener("input",renderMovies);$("searchBtn").onclick=renderMovies;$("closeSubscribe").onclick=closeSubscribe;$("skipSubscribe").onclick=e=>{e.preventDefault();closeSubscribe()};
load();if(!localStorage.getItem("teleMoviesSubscribeSeen"))setTimeout(()=>$("subscribe").classList.add("show"),700);
</script></body></html>
