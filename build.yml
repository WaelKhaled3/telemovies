name: Build SEO pages
on:
  push:
    branches: [main, master]
    paths: ['films.json','index.html','build.js']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - run: |
          git config user.name "TeleMovies Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "build: regenerate pages" && git pull --rebase && git push)
